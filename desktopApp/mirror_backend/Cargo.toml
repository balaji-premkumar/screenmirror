[package]
name = "mirror_backend"
version = "1.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Receives, decodes and routes the mirrored stream on the desktop."
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Shared with the mobile sender. The wire format and the Annex-B walker are
# defined once so the two ends cannot drift apart.
mirror-protocol = { workspace = true }
# Event codes and locale catalogs. The backend emits codes, never finished
# sentences — the interface decides the language. See packages/mirror-i18n.
mirror-i18n = { workspace = true }

rusb = "0.9"
# Only the decode + colour-conversion paths are used, so the default feature
# set is disabled: it would additionally pull in avfilter/avdevice and force
# libavfilter-dev/libavdevice-dev onto every build machine for no benefit.
ffmpeg-next = { version = "8.1", default-features = false, features = [
    "codec",
    "format",
    "software-scaling",
] }
concurrent-queue = "2.5"
shared_memory = "0.12"
bytes = "1"

anyhow = { workspace = true }
byteorder = { workspace = true }
chrono = { workspace = true }
libc = { workspace = true }
once_cell = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# No SDL2 and no cpal.
#
# Playback (window *and* sound) is delegated to a child ffplay process fed by
# the Matroska remuxer in sinks/player.rs, so the backend neither creates a
# window nor opens an audio device. That removes libsdl2-dev and libasound2-dev
# from the build requirements, and with them the SDL-on-macOS main-thread
# problem.
