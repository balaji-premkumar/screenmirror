name: Set up FFmpeg 8.1
description: >
  Downloads an LGPL shared build of FFmpeg 8.1 for Linux or Windows and points
  FFMPEG_DIR at it. The Rust crate is pinned to FFmpeg 8.1, and no runner image
  ships that version: Ubuntu has 6.1, and the Windows build previously used 7.1.
  The archive carries headers, import libraries and runtime libraries, so the
  same files are used to build and to package. The URL tracks the 8.1 branch,
  so patch releases are picked up. macOS installs ffmpeg@8 with Homebrew instead.

runs:
  using: composite
  steps:
    - name: FFmpeg 8.1 (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        url=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-lgpl-shared-8.1.tar.xz
        curl -fsSL --retry 5 "$url" -o "$RUNNER_TEMP/ffmpeg.tar.xz"
        mkdir -p "$RUNNER_TEMP/ffmpeg"
        tar -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" -C "$RUNNER_TEMP/ffmpeg" --strip-components=1
        echo "FFMPEG_DIR=$RUNNER_TEMP/ffmpeg" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=$RUNNER_TEMP/ffmpeg/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

    - name: FFmpeg 8.1 (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $url = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-lgpl-shared-8.1.zip'
        Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP/ffmpeg.zip"
        Expand-Archive "$env:RUNNER_TEMP/ffmpeg.zip" -DestinationPath "$env:RUNNER_TEMP/ffmpeg-extract"
        $dir = (Get-ChildItem "$env:RUNNER_TEMP/ffmpeg-extract")[0].FullName
        "FFMPEG_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        "$dir/bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
