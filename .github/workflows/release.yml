name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Nothing is published from a tag that does not pass the ordinary checks.
  checks:
    uses: ./.github/workflows/check.yml

  mobile:
    needs: checks
    uses: ./.github/workflows/mobile.yml

  desktop:
    needs: checks
    uses: ./.github/workflows/desktop.yml

  obs_plugin:
    needs: checks
    uses: ./.github/workflows/obs_plugin.yml

  create_release:
    name: Create the release
    runs-on: ubuntu-latest
    needs: [mobile, desktop, obs_plugin]
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/mirror-companion-apk/*.apk
            artifacts/mirror-desktop-ubuntu-latest/**/*
            artifacts/mirror-desktop-windows-latest/**/*
            artifacts/mirror-desktop-macos-latest/**/*
            artifacts/obs-plugin-linux/*.so
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: false
