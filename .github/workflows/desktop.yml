name: Build Desktop App

on:
  # Pull requests and master only check that everything compiles on all three
  # systems. Installable packages are made by the Release workflow, or by
  # running this one by hand.
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      channel:
        description: Electrobun build channel (canary or stable)
        type: choice
        options: [canary, stable]
        default: canary
      package:
        description: Make installable packages (workflow artifacts, kept 14 days)
        type: boolean
        default: true
  workflow_call:
    inputs:
      channel:
        type: string
        default: stable
      package:
        type: boolean
        default: false

# The event is in the group so a push to the branch a release runs from cannot
# cancel the release's build (a called workflow is grouped as its own run).
concurrency:
  group: desktop-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CHANNEL: ${{ inputs.channel || 'canary' }}

jobs:
  build_desktop:
    name: Desktop (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, label: linux-x64 }
          - { os: windows-latest, label: windows-x64 }
          - { os: macos-latest, label: macos-arm64 }
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # ffmpeg-sys-next needs FFmpeg 8.1 headers and libraries to link, and
      # bindgen needs libclang to generate the bindings. No runner image has
      # FFmpeg 8.1, so Linux and Windows download it (and the same files are
      # packaged), while macOS takes the versioned Homebrew formula.
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev pkg-config \
            libwebkit2gtk-4.1-dev cmake

      - uses: ./.github/actions/setup-ffmpeg
        if: runner.os != 'macOS'

      - name: FFmpeg and clang (macOS)
        if: runner.os == 'macOS'
        # The plain `ffmpeg` formula has moved on to 9, whose headers the crate
        # cannot compile against. The versioned formula is keg-only, so the
        # build is pointed at it below.
        run: brew install ffmpeg@8 pkg-config llvm

      # Windows cannot open a phone until WinUSB is bound to it. libwdi's
      # wdi-simple does that with a driver package it signs on the fly, so one
      # UAC prompt replaces a manual Zadig session. Upstream publishes no
      # binary, so build it the way libwdi's own MinGW workflow does. A failure
      # here must not fail the app build: the app then runs, and the installer
      # step in it explains what is missing.
      - name: Fetch libwdi (Windows)
        if: inputs.package && runner.os == 'Windows'
        continue-on-error: true
        shell: cmd
        run: |
          git clone --depth 1 --branch v1.5.1 https://github.com/pbatard/libwdi libwdi-src
          curl -L https://go.microsoft.com/fwlink/p/?LinkID=253170 -o libwdi-src\wdk-redist.msi
          msiexec /a libwdi-src\wdk-redist.msi /qn TARGETDIR=%CD%\libwdi-src\wdk

      - name: MinGW toolchain (Windows)
        if: inputs.package && runner.os == 'Windows'
        continue-on-error: true
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: false
          install: >-
            mingw-w64-x86_64-toolchain
            base-devel
            autotools
            git

      - name: Build wdi-simple (Windows)
        if: inputs.package && runner.os == 'Windows'
        continue-on-error: true
        shell: msys2 {0}
        working-directory: libwdi-src
        run: |
          set -e
          ./bootstrap.sh
          ./configure --build=x86_64-w64-mingw32 --host=x86_64-w64-mingw32 \
            --enable-toggable-debug --enable-examples-build --disable-debug \
            --disable-shared --disable-32bit \
            --with-wdkdir="wdk/Windows Kits/8.0" --with-wdfver=1011
          make
          mkdir -p ../desktopApp/wdi
          cp examples/wdi-simple.exe ../desktopApp/wdi/

      - name: Install JS dependencies
        working-directory: desktopApp
        run: bun install

      - name: Build the backend
        run: cargo build --release -p mirror_backend
        env:
          # The packaged FFmpeg libraries sit next to the backend library, so it
          # has to look in its own directory for them.
          RUSTFLAGS: ${{ runner.os == 'Linux' && '-C link-arg=-Wl,-rpath,$ORIGIN' || '' }}
          PKG_CONFIG_PATH: ${{ runner.os == 'macOS' && '/usr/local/opt/ffmpeg@8/lib/pkgconfig:/opt/homebrew/opt/ffmpeg@8/lib/pkgconfig' || '' }}

      # The OBS source plugin is bundled so "Install plugin" works from the
      # package.
      - name: Build the OBS plugin
        id: plugin
        uses: ./.github/actions/build-obs-plugin

      # Also published on its own, for people who install it by hand. Named
      # per platform: the Linux and macOS files are both mirror-source.so.
      - name: Name the OBS plugin
        if: inputs.package
        shell: bash
        run: |
          src="${{ steps.plugin.outputs.path }}"
          mkdir -p plugin-dist
          cp "$src" "plugin-dist/mirror-source-${{ matrix.label }}.${src##*.}"

      - uses: actions/upload-artifact@v4
        if: inputs.package
        with:
          name: obs-plugin-${{ matrix.label }}
          path: plugin-dist/*
          if-no-files-found: error
          retention-days: 14

      # Cross-platform since it became a Bun script. The shell version it
      # replaced could not run here at all on Windows, so that job built the
      # DLL and then bundled nothing.
      - name: Bundle native libraries
        if: inputs.package
        working-directory: desktopApp
        run: bun run build:bundle

      # `electrobun build` writes the installer and update files to
      # desktopApp/artifacts/. The channel only changes the file names and the
      # update metadata; nothing is signed until certificates are configured.
      - name: Package the app
        if: inputs.package
        working-directory: desktopApp
        run: |
          bun run build:vite
          bunx electrobun build --env=${{ env.CHANNEL }}

      - name: List the package files
        if: inputs.package
        shell: bash
        run: ls -lh desktopApp/artifacts

      - uses: actions/upload-artifact@v4
        if: inputs.package
        id: upload
        with:
          name: ScreenMirror-${{ matrix.label }}
          path: desktopApp/artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Link in the run summary
        if: inputs.package
        shell: bash
        run: |
          echo "### ScreenMirror ${{ matrix.label }}" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download the package](${{ steps.upload.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"
