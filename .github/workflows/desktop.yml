name: Build Desktop App

on:
  # Every push builds installable packages, so a branch can be tried on all
  # three systems without cutting a release. Nothing is published: the files
  # are workflow artifacts, kept for 14 days.
  push:
  workflow_dispatch:
    inputs:
      channel:
        description: Electrobun build channel (canary or stable)
        type: choice
        options: [canary, stable]
        default: canary
  workflow_call:
    inputs:
      channel:
        type: string
        default: stable

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  CHANNEL: ${{ inputs.channel || 'canary' }}

jobs:
  build_desktop:
    name: Desktop (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, label: linux-x64 }
          - { os: windows-latest, label: windows-x64 }
          - { os: macos-latest, label: macos-arm64 }
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # ffmpeg-sys-next needs the FFmpeg development libraries to link, and
      # bindgen needs libclang to generate the bindings. Every platform has to
      # supply both, which is what issue #5 was about: Windows installed no
      # FFmpeg at all, and Linux installed FFmpeg but not clang.
      - name: FFmpeg and clang (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang libclang-dev pkg-config \
            libavcodec-dev libavformat-dev libswscale-dev libavutil-dev \
            libwebkit2gtk-4.1-dev \
            cmake libobs-dev

      - name: FFmpeg and clang (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg pkg-config llvm

      # There is no FFmpeg dev package on the Windows runners, so fetch a
      # prebuilt shared build and point the ffmpeg-sys build script at it.
      - name: FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = 'https://github.com/GyanD/codexffmpeg/releases/download/7.1/ffmpeg-7.1-full_build-shared.zip'
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath $env:RUNNER_TEMP
          $dir = (Get-ChildItem "$env:RUNNER_TEMP/ffmpeg-*-full_build-shared")[0].FullName
          "FFMPEG_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$dir/bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # Windows cannot open a phone until WinUSB is bound to it. libwdi's
      # wdi-simple does that with a driver package it signs on the fly, so one
      # UAC prompt replaces a manual Zadig session. Upstream publishes no
      # binary, so build it the way libwdi's own MinGW workflow does. A failure
      # here must not fail the app build: the app then runs, and the installer
      # step in it explains what is missing.
      - name: Fetch libwdi (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: cmd
        run: |
          git clone --depth 1 --branch v1.5.1 https://github.com/pbatard/libwdi libwdi-src
          curl -L https://go.microsoft.com/fwlink/p/?LinkID=253170 -o libwdi-src\wdk-redist.msi
          msiexec /a libwdi-src\wdk-redist.msi /qn TARGETDIR=%CD%\libwdi-src\wdk

      - name: MinGW toolchain (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: false
          install: >-
            mingw-w64-x86_64-toolchain
            base-devel
            autotools
            git

      - name: Build wdi-simple (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: msys2 {0}
        working-directory: libwdi-src
        run: |
          set -e
          ./bootstrap.sh
          ./configure --build=x86_64-w64-mingw32 --host=x86_64-w64-mingw32 \
            --enable-toggable-debug --enable-examples-build --disable-debug \
            --disable-shared --disable-32bit \
            --with-wdkdir="wdk/Windows Kits/8.0" --with-wdfver=1011
          make
          mkdir -p ../desktopApp/wdi
          cp examples/wdi-simple.exe ../desktopApp/wdi/

      - name: Install JS dependencies
        working-directory: desktopApp
        run: bun install

      - name: Build the backend
        run: cargo build --release -p mirror_backend
        env:
          PKG_CONFIG_PATH: ${{ runner.os == 'macOS' && '/usr/local/opt/ffmpeg/lib/pkgconfig:/opt/homebrew/opt/ffmpeg/lib/pkgconfig' || '' }}

      # The OBS source plugin is bundled so "Install plugin" works from the
      # package. Linux only: Windows and macOS need the OBS SDK, which CI does
      # not fetch yet, and the bundler treats the plugin as optional.
      - name: Build the OBS plugin (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -S desktopApp/obs_plugin -B desktopApp/obs_plugin/build -DCMAKE_BUILD_TYPE=Release
          cmake --build desktopApp/obs_plugin/build --config Release

      # Cross-platform since it became a Bun script. The shell version it
      # replaced could not run here at all on Windows, so that job built the
      # DLL and then bundled nothing.
      - name: Bundle native libraries
        working-directory: desktopApp
        run: bun run build:bundle

      # `electrobun build` writes the installer and update files to
      # desktopApp/artifacts/. The channel only changes the file names and the
      # update metadata; nothing is signed until certificates are configured.
      - name: Package the app
        working-directory: desktopApp
        run: |
          bun run build:vite
          bunx electrobun build --env=${{ env.CHANNEL }}

      - name: List the package files
        shell: bash
        run: ls -lh desktopApp/artifacts

      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: ScreenMirror-${{ matrix.label }}
          path: desktopApp/artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Link in the run summary
        shell: bash
        run: |
          echo "### ScreenMirror ${{ matrix.label }}" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download the package](${{ steps.upload.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"
