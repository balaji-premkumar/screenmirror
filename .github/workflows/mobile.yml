name: Build Mobile App

on:
  # Pull requests and master only check that the APK builds. A signed APK is
  # made by the Release workflow, or by running this one by hand. Without a
  # release key it is signed with the debug key and named as such, so it
  # cannot be mistaken for a release.
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      package:
        description: Sign the APK and keep it (workflow artifact, kept 14 days)
        type: boolean
        default: true
  workflow_call:
    inputs:
      package:
        type: boolean
        default: false
      require_release_signing:
        description: Fail instead of producing a debug-signed APK
        type: boolean
        default: false

# The event is in the group so a push to the branch a release runs from cannot
# cancel the release's build (a called workflow is grouped as its own run).
concurrency:
  group: mobile-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build_android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mobileApp/rust

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Fetch packages
        working-directory: mobileApp
        run: flutter pub get

      # Without the secrets (a fork, or a repo that never set them) nothing is
      # written and the build falls back to the debug key, checked below.
      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        if: inputs.package && env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/upload.jks" "$KEYSTORE_PASSWORD" "${KEY_ALIAS:-upload}" "$KEYSTORE_PASSWORD" \
            > mobileApp/android/key.properties

      # The ABI list matches the default in android/app/build.gradle.kts. Naming
      # it here means a change to that default does not silently change what
      # ships.
      - name: Build the APK
        working-directory: mobileApp
        run: flutter build apk --release -PmirrorAbis=arm64-v8a,armeabi-v7a,x86_64

      # The release build falls back to the debug signing key when
      # android/key.properties is absent, and logs a warning saying so. That key
      # is public, so anyone can re-sign such an APK and impersonate the build.
      # It is fine for trying a branch and never fine for a release: releases
      # set require_release_signing, which turns this into a failure.
      - name: Check how the APK is signed
        if: inputs.package
        id: signing
        working-directory: mobileApp
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          # apksigner reads every signature scheme. The check this replaces
          # looked for META-INF/*.RSA, which only exists in v1 (jar) signatures;
          # a modern APK has none, so it reported "not debug-signed" for a
          # debug-signed build.
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          certs=$("$apksigner" verify --print-certs "$apk")
          echo "$certs" | head -3
          if echo "$certs" | grep -q "CN=Android Debug"; then
            if [ "${{ inputs.require_release_signing }}" = "true" ]; then
              echo "::error::The APK is signed with the debug key. Configure android/key.properties."
              exit 1
            fi
            echo "::warning::Signed with the public debug key. For testing only; do not distribute."
            echo "name=ScreenMirror-android-debug-signed" >> "$GITHUB_OUTPUT"
          else
            echo "name=ScreenMirror-android" >> "$GITHUB_OUTPUT"
          fi

      - name: Name the APK
        if: inputs.package
        run: |
          mkdir -p dist
          cp mobileApp/build/app/outputs/flutter-apk/app-release.apk "dist/${{ steps.signing.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        if: inputs.package
        id: upload
        with:
          name: ${{ steps.signing.outputs.name }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Link in the run summary
        if: inputs.package
        run: |
          echo "### ${{ steps.signing.outputs.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download the APK](${{ steps.upload.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"
